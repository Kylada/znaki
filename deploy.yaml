name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token needed for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages work: skip redundant queued runs, but never abort a
# deployment that is already in flight (GitHub's recommended posture).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build: produces exactly ONE artifact named "github-pages".
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24        # Node 20 is deprecated on runners; 24 silences the warning
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build        # Vite (single-file) -> ./dist/index.html

      # GitHub Pages should not run Jekyll over the built single-file bundle.
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # Make re-runs deterministic. If a previous attempt (or a finalize-upload
      # retry) already left a "github-pages" artifact attached to this run,
      # deploy-pages would abort with "Artifact count is 2". Delete any stale
      # copy first. failOnError:false so the very first attempt (nothing to
      # delete) does not fail.
      - name: Delete stale github-pages artifact (safe on re-runs)
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---------------------------------------------------------------------------
  # Deploy: consumes the single artifact and publishes it.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
